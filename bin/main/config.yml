ws:
  bindAddress: "0.0.0.0"
  port: 8787
  requirePairing: true
  requireSession: true
  allowLegacyPairing: false
  advertiseAddress: "127.0.0.1"
  advertisePort: 8787
  advertiseScheme: "ws"
  maxMsgPerSecond: 30
  maxMsgBytes: 8192
  originWhitelist:
    - "*"
http:
  enabled: true
  bindAddress: "0.0.0.0"
  port: 8788
  cacheSeconds: 300
pairing:
  enabled: true
  windowSeconds: 60
magicLink:
  enabled: true
  baseUrl: "https://turbowarp.org/editor"
  extensionTemplate: "https://cdn.jsdelivr.net/gh/nando256/twbridge@:branch/turbowarp/twbridge-:lang.js"
  useLocalHttp: true
  tokenTtlSeconds: 300
  defaultLang: "en"
  defaultBranch: "main"
debug: false
