ws:
  bindAddress: "0.0.0.0"
  advertisedAddress: ""
  port: 8787
  requirePairing: true
  requireSession: true
  allowLegacyPairing: false
  maxMsgPerSecond: 30
  maxMsgBytes: 8192
  originWhitelist:
    - "*"
http:
  enabled: true
  bindAddress: "0.0.0.0"
  advertisedAddress: ""
  port: 8788
  cacheSeconds: 300
turbowarp:
  download:
    enabled: true
    zipUrl: "https://github.com/nando256/TurboAgent/releases/download/v3.0.0/www-client.zip"
    forceOnStart: false
pairing:
  enabled: true
  windowSeconds: 60
magicLink:
  enabled: true
  tokenTtlSeconds: 300
  defaultLang: "en"
  defaultBranch: "main"
debug: false
